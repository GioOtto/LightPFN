[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "LightPFN"
version = "1.1.0"
description = "A 4.6M-parameter tabular classifier pretrained only on synthetic data, with a scikit-learn API and CPU, CUDA/ROCm and Vulkan inference"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Giorgio Ottoboni", email = "247403232+GioOtto@users.noreply.github.com"}]
keywords = ["tabular", "classification", "in-context learning", "foundation model", "tabpfn", "scikit-learn", "vulkan"]
dependencies = [
  "numpy>=1.24",
  "torch>=2.6",
  "scikit-learn>=1.6",
  "huggingface-hub>=0.27",
  "safetensors>=0.5",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
vulkan = ["wgpu>=0.32,<0.33"]
# synthetic priors and pretraining (lightpfn.prior, lightpfn.train); the graph prior uses TabICL's (BSD-3-Clause)
train = ["tabicl==2.2.0", "pandas>=2.0", "scipy>=1.11", "threadpoolctl>=3.1"]
# evaluation harness and tree baselines (lightpfn.eval)
eval = ["pandas>=2.0", "threadpoolctl>=3.1", "joblib>=1.3", "openml>=0.15", "catboost>=1.2", "lightgbm>=4.0", "xgboost>=2.0"]
dev = ["pytest>=8", "pandas>=2.0", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/GioOtto/LightPFN"
Documentation = "https://github.com/GioOtto/LightPFN/blob/main/docs/en/GUIDE.md"
Paper = "https://github.com/GioOtto/LightPFN/blob/main/paper/LightPFN_report.pdf"
Weights = "https://huggingface.co/ueuegio/LightPFN"
Issues = "https://github.com/GioOtto/LightPFN/issues"

[tool.hatch.build.targets.wheel]
packages = ["lightpfn"]
# the wheel holds inference only; training, priors and evaluation stay in the source repository
exclude = ["lightpfn/train.py", "lightpfn/prior", "lightpfn/eval", "lightpfn/model/ccmm.py"]

[tool.hatch.build.targets.sdist]
include = ["/lightpfn", "/pyproject.toml", "/LICENSE", "/NOTICE", "/README.md",
           "/tests/test_release.py", "/tests/test_sklearn_api.py", "/tests/test_sklearn_context.py"]
exclude = ["lightpfn/train.py", "lightpfn/prior", "lightpfn/eval", "lightpfn/model/ccmm.py", "**/__pycache__"]

